<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>CrowdAIMovie · 手机播放检查</title>
  <style>
    body { margin: 0 auto; padding: 24px 16px; max-width: 680px; background: #f5f6fb; color: #192032; font: 16px/1.6 system-ui, sans-serif; }
    h1 { font-size: 24px; } video { display: block; width: 100%; aspect-ratio: 16/9; background: #111; margin: 20px 0; }
    button, select { font: inherit; padding: 12px; border: 1px solid #bbc3d6; border-radius: 8px; background: white; color: #192032; }
    button { display: block; width: 100%; margin: 12px 0; cursor: pointer; }
    button:first-of-type { background: #3348ec; color: white; }
    pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 16px; background: white; border-radius: 8px; font-size: 13px; }
    a { color: #3348ec; } #status { min-height: 3em; }
  </style>
  <script src="/playback-check.js" defer></script>
</head>
<body>
  <h1>手机播放检查</h1>
  <p>使用与放映厅相同的视频，只保留浏览器原生控件。请先点第一项；如果失败，再点第二项。结果会自动发送。</p>
  <label>检查片段 <select id="scene"><option value="14">第 14 段</option><option value="1">第 1 段</option></select></label>
  <video id="video" controls playsinline preload="none"></video>
  <button id="inline" type="button">1. 在页面内播放</button>
  <button id="fullscreen" type="button">2. 用系统全屏播放</button>
  <p id="status" role="status" aria-live="polite">等待点击。</p>
  <a id="direct" target="_blank" rel="noopener">直接打开同一个 MP4</a>
  <pre id="details">尚未开始检查</pre>
  <p><a href="/movies/whos-next">返回放映厅</a></p>
</body>
</html>
